version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omniflow-postgres
    environment:
      POSTGRES_USER: omniflow
      POSTGRES_PASSWORD: omniflow_secret
      POSTGRES_DB: omniflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniflow -d omniflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: omniflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: omniflow-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.backend
    container_name: omniflow-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://omniflow:omniflow_secret@postgres:5432/omniflow_db
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - APP_ENV=production

  frontend:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.frontend
    container_name: omniflow-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
