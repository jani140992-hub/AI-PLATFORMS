[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniflow-python"
version = "1.0.0"
description = "Official Python Client SDK for OmniFlow AI Enterprise Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "OmniFlow AI Team", email = "sdk@omniflow.ai" }]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]
